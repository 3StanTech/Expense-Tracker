# Local Supabase project config for Fundsicles.
# Apply migrations only after a separate verification pass grees local work.

project_id = "fundsicles"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
